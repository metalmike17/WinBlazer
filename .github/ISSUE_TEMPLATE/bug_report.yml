name: Bug report
description: Tell us what went wrong in the WinBlazer beta
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing WinBlazer!

        **This form is public.** Before sending, remove your name, file paths, network details and anything else personal
        from your text, logs and screenshots.

        **Security problem?** Do not post it here. Use **Report a vulnerability** on the Security tab.
  - type: dropdown
    id: version
    attributes:
      label: WinBlazer version
      options:
        - 0.1.0 beta
        - Other or not sure
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Installer
        - Portable ZIP
        - PowerShell commands
        - I built it myself
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Windows+R, type winver and press Enter.
      placeholder: For example, Windows 11 Home 24H2
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: Was WinBlazer running as administrator?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Include the page you were on and any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Open ...
        2. Click ...
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or log text
      description: Optional. Unexpected errors are saved in crash.log in %LOCALAPPDATA%\PCOptimizerNet. Check it for personal details first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked what I'm sending and removed personal details.
          required: true
