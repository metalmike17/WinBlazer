name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build with the self-test
        run: dotnet build PCOptimizerNet.csproj -c Release
      - name: Build the way it is released
        run: dotnet build PCOptimizerNet.csproj -c Release -p:WithoutSelfTest=true --no-incremental
